<!doctype html>
<html lang='en'>
    <head>
        <title>funny prototype</title>
        <meta name="description" content="Early prototype for final webware project">
        <script src='digital.js'></script>
        <link rel='stylesheet' href='digital.css'/>
        <meta charset='utf-8' />
        <!-- get rid of favicon error -->
        <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
    </head>
    <body>
        <div class="gameContainer">
            <img src="images/background.png" class="backgroundImage"/>
            <canvas id="canvas">
                game's supposed to show up here. if you see this text, RUN. IT'S COMING.
            </canvas>
        </div>



        <p>A*cos(1x + a) + B*cos(2x + b) + C*cos(3x + c)</p>
        <p>Waveform settings:</p>
        <div>
            <input type="range" id="A" name="A" min="0" max="2" value="1" step="0.01"/>
            <label for="A">A (1Hz amplitude)</label>
            <input type="range" id="a" name="a" min="-180" max="180" value="0" step="1"/>
            <label for="a">a (1Hz phase)</label>
        </div>
        <div>
            <input type="range" id="B" name="B" min="0" max="2" value="0" step="0.01"/>
            <label for="B">B (2Hz amplitude)</label>
            <input type="range" id="b" name="b" min="-180" max="180" value="0" step="1"/>
            <label for="b">b (2Hz phase)</label>
        </div>
        <div>
            <input type="range" id="C" name="C" min="0" max="2" value="0" step="0.01"/>
            <label for="C">C (3Hz amplitude)</label>
            <input type="range" id="c" name="c" min="-180" max="180" value="0" step="1"/>
            <label for="c">c (3Hz phase)</label>
        </div>
    </body>
</html>
